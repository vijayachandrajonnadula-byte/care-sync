<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#CBC5C1;border-radius:999px;}
    ::-webkit-scrollbar-thumb:hover{background:#AAA3A5;}
    @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
  </style>
</helmet>

<div style="display:flex; height:100vh; font-family:'Source Sans 3',-apple-system,sans-serif; overflow:hidden; background:#F7F6F4;">

  <!-- CLINICAL SIDEBAR -->
  <nav style="width:232px; min-width:232px; background:#201C20; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; border-right:1px solid #2A252A;">
    <div style="padding:16px 14px 13px; border-bottom:1px solid #2A252A; display:flex; align-items:center; gap:10px; flex-shrink:0;">
      <div style="width:30px; height:30px; background:#40233F; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2C7 4 5 7 5 10s2 6 5 8c3-2 5-5 5-8S13 4 10 2Z" fill="#B79BB3" opacity=".7"/><circle cx="10" cy="10" r="2.5" fill="#F0EEEB"/></svg>
      </div>
      <div>
        <div style="color:#F0EEEB; font-size:13px; font-weight:700; line-height:1.3; letter-spacing:-.01em;">CareSync</div>
        <div style="color:#4E484C; font-size:10px; font-weight:500; line-height:1.4;">General Medicine</div>
      </div>
    </div>
    <div style="flex:1; overflow-y:auto; padding:8px 8px 0;">
      <sc-for list="{{ navItems }}" as="item">
        <div onClick="{{ item.onClick }}" style="display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:5px; cursor:pointer; margin-bottom:1px; background:{{ item.bg }};" style-hover="background:#332E32;">
          {{ item.iconEl }}
          <span style="flex:1; font-size:12px; font-weight:{{ item.fw }}; color:{{ item.lc }}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4;">{{ item.label }}</span>
          <sc-if value="{{ item.hasBadge }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:10px; font-weight:700; color:#B79BB3; background:#40233F; padding:1px 6px; border-radius:10px; flex-shrink:0;">{{ item.badge }}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="padding:12px 14px; border-top:1px solid #2A252A; flex-shrink:0; margin-top:8px;">
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:30px; height:30px; border-radius:999px; background:#553052; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1.5px solid #684663;">
          <span style="color:#EEE7ED; font-size:10px; font-weight:700;">AR</span>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="color:#E2DEDA; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4;">Dr. Ananya Rao</div>
          <div style="color:#4E484C; font-size:10px; line-height:1.3;">General Medicine · Morning Shift</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN AREA -->
  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0;">

    <!-- Top utility bar -->
    <header style="height:56px; background:#FFFFFF; border-bottom:1px solid #E2DEDA; display:flex; align-items:center; padding:0 24px; gap:12px; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:8px; padding:6px 12px; background:#F7F6F4; border:1px solid #E2DEDA; border-radius:5px; flex:1; max-width:300px; cursor:pointer;">
        {{ searchIcon }}
        <span style="font-size:13px; color:#AAA3A5;">Search patients, records…</span>
        <span style="margin-left:auto; font-size:10px; color:#CBC5C1; background:#F0EEEB; padding:2px 6px; border-radius:3px; border:1px solid #E2DEDA;">⌘K</span>
      </div>
      <div style="width:1px; height:20px; background:#E2DEDA;"></div>
      <div style="display:flex; align-items:center; gap:6px; padding:5px 10px; background:#FFFFFF; border:1px solid #E2DEDA; border-radius:5px; cursor:pointer;" style-hover="background:#F7F6F4;">
        <span style="font-size:12px; font-weight:600; color:#4E484C;">General Medicine</span>
        {{ chevronDown }}
      </div>
      <div style="display:flex; align-items:center; gap:6px; padding:5px 12px; background:#E8F3EC; border:1px solid #ACD2BC; border-radius:5px;">
        <div style="width:6px; height:6px; border-radius:50%; background:#26734D;"></div>
        <span style="font-size:12px; font-weight:600; color:#1D5B3D;">Morning Shift</span>
        <span style="font-size:12px; color:#26734D;">08:47</span>
      </div>
      <div style="margin-left:auto; display:flex; align-items:center; gap:6px;">
        <button onClick="{{ toggleAnn }}" style="display:flex; align-items:center; gap:5px; padding:5px 12px; background:{{ annBg }}; border:1px solid {{ annBorder }}; border-radius:5px; cursor:pointer; font-family:'Source Sans 3',sans-serif; font-size:12px; font-weight:600; color:{{ annColor }};">
          {{ annBtn }}
        </button>
        <div style="width:1px; height:20px; background:#E2DEDA;"></div>
        <div style="position:relative; cursor:pointer; padding:7px; border-radius:5px;" style-hover="background:#F7F6F4;">
          {{ bellIcon }}
          <div style="position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background:#B42318; border:1.5px solid white;"></div>
        </div>
        <div style="cursor:pointer; padding:7px; border-radius:5px;" style-hover="background:#F7F6F4;">{{ helpIcon }}</div>
        <div style="width:30px; height:30px; border-radius:50%; background:#553052; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1.5px solid #684663; margin-left:2px;">
          <span style="font-size:10px; font-weight:700; color:#EEE7ED;">AR</span>
        </div>
      </div>
    </header>

    <!-- Screen content -->
    <main style="flex:1; overflow-y:auto; overflow-x:hidden;">
      {{ screenContent }}
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    screen: 'shift-briefing',
    showAnn: false,
    ackStates: { 'meera-glucose': 'new', 'arjun-wait': 'new', 'rohan-rx': 'new' },
    flowStates: { 'CP-10482': 'checked-in', 'CP-10221': 'waiting', 'CP-10301': 'scheduled', 'CP-10118': 'pending' },
    drawer: 'CP-10482',
    msgThread: 'meera-glucose',
    msgState: 'new',
    msgComposer: 'reply',
    taskStates: { 'review-glucose': 'new', 'approve-rx': 'pending', 'ho1': 'new', 'ho2': 'new', 'ho3': 'new' },
    recordNav: 'summary',
    insightsFilter: 'this-shift',
    ptab: 'overview',
    showAssign: false,
  };

  T = {
    n0:'#FFFFFF',n25:'#FCFBFA',n50:'#F7F6F4',n100:'#F0EEEB',n200:'#E2DEDA',
    n300:'#CBC5C1',n400:'#AAA3A5',n500:'#7B7477',n600:'#635C60',
    n700:'#4E484C',n800:'#332E32',n900:'#201C20',
    b50:'#F7F3F7',b100:'#EEE7ED',b200:'#DCCED9',b300:'#B79BB3',
    b400:'#8C6688',b500:'#684663',b600:'#553052',b700:'#40233F',b800:'#321B31',
    cr50:'#FDECEA',cr200:'#F0B9B5',cr600:'#B42318',cr700:'#912018',
    wa50:'#FFF3DA',wa200:'#E9C77A',wa600:'#8A5600',wa700:'#684000',
    su50:'#E8F3EC',su200:'#ACD2BC',su600:'#26734D',su700:'#1D5B3D',
    in50:'#EAF2FA',in200:'#B8D0E8',in600:'#265D97',in700:'#1D4A78',
  };

  IP = {
    home:`<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>`,
    users:`<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>`,
    calendar:`<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`,
    fileText:`<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>`,
    messageSquare:`<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>`,
    checkSquare:`<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>`,
    barChart2:`<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>`,
    settings:`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06-.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>`,
    bell:`<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>`,
    search:`<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>`,
    chevronDown:`<polyline points="6 9 12 15 18 9"/>`,
    chevronRight:`<polyline points="9 18 15 12 9 6"/>`,
    chevronLeft:`<polyline points="15 18 9 12 15 6"/>`,
    helpCircle:`<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
    alertTriangle:`<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
    alertCircle:`<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>`,
    checkCircle:`<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>`,
    info:`<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>`,
    user:`<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>`,
    clock:`<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
    trendingUp:`<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>`,
    trendingDown:`<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>`,
    arrowUp:`<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>`,
    arrowDown:`<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>`,
    minus:`<line x1="5" y1="12" x2="19" y2="12"/>`,
    moreHorizontal:`<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>`,
    plus:`<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`,
    x:`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`,
    shield:`<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`,
    eye:`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`,
    edit:`<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>`,
    send:`<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>`,
    check:`<polyline points="20 6 9 17 4 12"/>`,
    filter:`<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>`,
    copy:`<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>`,
    download:`<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
    activity:`<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>`,
    pill:`<path d="M10.5 20.5L3.5 13.5a5 5 0 017-7l7 7a5 5 0 01-7 7z"/><line x1="9" y1="10" x2="15" y2="16"/>`,
    clipboard:`<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1" ry="1"/>`,
    lock:`<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>`,
    repeat:`<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>`,
    tag:`<path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>`,
  };

  ANN = {
    'shift-briefing': [
      {n:1, law:"Serial Position Effect", note:"Meera Iyer occupies the primacy position. Humans recall and act on items they encounter first -- the most critical case must be seen first."},
      {n:2, law:"Fitts's Law", note:'"Review patient record" is the largest button and sits at the natural reading terminus of the card. Larger, closer targets reduce time-to-action.'},
      {n:3, law:"Law of Proximity", note:"Glucose and BP values are in adjacent cards. Related clinical data stays spatially grouped -- no mental assembly required from the clinician."},
      {n:4, law:"Hick's Law", note:"Three action buttons per case (Review, Assign, Acknowledge). Every additional option increases decision time logarithmically -- fewer choices act faster."},
      {n:5, law:"Progressive Disclosure", note:"Full patient detail lives behind 'Review patient record', not on the briefing surface. Depth on demand keeps the command centre clean."},
      {n:6, law:"Von Restorff Effect", note:"Amber left-border accent isolates the featured case from the neutral surface. The visually different element is remembered and acted on."},
      {n:7, law:"Miller's Law", note:"Maximum 3 immediate attention items. Chunking clinical urgency to 7+/-2 items keeps working memory load manageable under shift pressure."},
    ],
    'patients': [
      {n:1, law:"F-Pattern Scanpath", note:"Patient name anchors the leftmost column -- aligned with the natural F-pattern reading path. The eye lands on the most identifying data first."},
      {n:2, law:"Status Visibility", note:"Status column is always visible without interaction. The clinician sees the full picture before deciding to open the drawer."},
      {n:3, law:"Contextual Relevance", note:"The right drawer surfaces only what matters for the selected patient -- no blank fields, no generic form structure."},
    ],
    'patient-profile': [
      {n:1, law:"Anchoring", note:"Previous glucose (118) is shown alongside current (142). The anchor makes the change (+24, +20%) immediately interpretable without mental calculation."},
      {n:2, law:"Von Restorff Effect", note:'"Changes since review" section uses amber to isolate new clinical signals. Clinically important changes are visually distinct from stable background data.'},
      {n:3, law:"Recognition over Recall", note:"Penicillin allergy is persistent in the sticky header. The clinician never needs to recall it -- it is always present in the viewport."},
      {n:4, law:"Direct Manipulation", note:"The glucose trend chart shows a reference band. The target range is displayed rather than memorised, reducing clinical error risk."},
      {n:5, law:"Law of Continuity", note:"Clinical timeline follows a vertical path -- the eye moves naturally from the most recent event downward through history."},
    ],
    'appointments': [
      {n:1, law:"Goal Gradient Effect", note:"Waiting time (22m) and delay (+12m) are shown in amber. Proximity to the threshold communicates urgency -- the clinician acts before the queue worsens."},
      {n:2, law:"Affordance", note:'"Begin consult" appears only for Checked-in patients. Contextually appropriate actions reduce noise and prevent interaction errors.'},
      {n:3, law:"Chunking", note:"Queue health strip aggregates 8 separate metrics into 5 scannable indicators. Complex operational data is chunked into a single decision-ready summary."},
    ],
    'messages': [
      {n:1, law:"Error Prevention (Nielsen)", note:"Patient message composer shows a warning strip. Preventing accidental clinical communication to patients is a safety requirement -- the warning must be impossible to miss."},
      {n:2, law:"Affordance", note:"Three composer modes use distinct backgrounds and labels. The visual difference communicates purpose before reading the tab label."},
      {n:3, law:"Figure-Ground (Gestalt)", note:"Active conversation on white; thread list on neutral background. Foreground/background contrast guides eye movement without explicit instructions."},
    ],
    'tasks': [
      {n:1, law:"Goal Gradient Effect", note:'"Now" group appears first. Proximity to a deadline increases motivation to act -- temporal grouping creates urgency without visual panic.'},
      {n:2, law:"Ownership Visibility", note:"Every task shows an owner inline. Ambiguous ownership is a primary cause of clinical errors -- CareSync makes responsibility explicit and auditable."},
      {n:3, law:"Law of Closure", note:"Completed tasks remain in the list but are visually muted. Closure maintains the mental model of the full task set rather than hiding completion."},
    ],
    'medical-records': [
      {n:1, law:"Information Scent", note:'"New" badge on the lab results nav item. Users follow the strongest information scent -- labelled novelty drives navigation to the right place.'},
      {n:2, law:"Aesthetic-Usability Effect", note:"Structured audit history with clear columns reads as trustworthy. A well-organised audit trail is both clinically functional and legally required."},
    ],
    'operational-insights': [
      {n:1, law:"Actionable Insights", note:"Each insight card ends with a recommended action and an owner. Data without a next step is noise -- every metric must lead to a decision."},
      {n:2, law:"Reference Frame (Tufte)", note:"Capacity threshold is a horizontal line on the arrivals chart. Without a reference frame, data has no clinical or operational meaning."},
      {n:3, law:"Data-Ink Ratio (Tufte)", note:"Bars, expected baseline, and capacity threshold convey three data layers in one chart -- maximum meaning from minimum ink."},
    ],
  };

  buildAnnPanel = (screen) => {
    const T=this.T; const e=React.createElement;
    const anns=this.ANN[screen]||[];
    return e('div',{style:{width:296,flexShrink:0,background:T.n0,borderLeft:`1px solid ${T.n200}`,display:'flex',flexDirection:'column',overflow:'hidden'}},
      e('div',{style:{padding:'14px 16px',borderBottom:`1px solid ${T.n200}`,background:T.b700,flexShrink:0}},
        e('div',{style:{fontSize:11,fontWeight:700,color:T.b300,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:3}},'Design rationale'),
        e('div',{style:{fontSize:12,color:T.b300,opacity:.75}},'UX laws applied to this screen')
      ),
      e('div',{style:{flex:1,overflowY:'auto',padding:'12px 14px'}},
        anns.length===0?e('div',{style:{padding:'20px 0',textAlign:'center',fontSize:13,color:T.n400}},'No annotations for this screen.'):
        anns.map((a,i)=>
          e('div',{key:a.n,style:{marginBottom:14,paddingBottom:14,borderBottom:i<anns.length-1?`1px solid ${T.n100}`:'none'}},
            e('div',{style:{display:'flex',gap:8,marginBottom:5,alignItems:'flex-start'}},
              e('span',{style:{width:20,height:20,borderRadius:'50%',background:T.b700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:10,fontWeight:700,color:T.n0}},a.n),
              e('span',{style:{fontSize:13,fontWeight:700,color:T.n900,lineHeight:'18px'}},a.law)
            ),
            e('p',{style:{margin:0,fontSize:12,color:T.n600,lineHeight:'18px',paddingLeft:28}},a.note)
          )
        )
      ),
      e('div',{style:{padding:'10px 14px',borderTop:`1px solid ${T.n200}`,background:T.n50,flexShrink:0}},
        e('div',{style:{fontSize:11,color:T.n400,lineHeight:'16px'}},'Laws: Fitts · Hick · Miller · Gestalt · Nielsen · Tufte · Von Restorff')
      )
    );
  };

  ic = (name, size=18, color='#7B7477') => {
    const p = this.IP[name] || this.IP.info;
    return React.createElement('span', {
      dangerouslySetInnerHTML: { __html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>` },
      style: { display: 'inline-flex', alignItems: 'center', flexShrink: 0, lineHeight: 0 }
    });
  };

  bdg = (text, v='neutral') => {
