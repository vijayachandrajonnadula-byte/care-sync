<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBC5C1; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #AAA3A5; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  </style>
</helmet>

<div style="display:flex; height:100vh; font-family:'Source Sans 3',-apple-system,sans-serif; overflow:hidden; background:#F7F6F4;">

  <!-- SIDEBAR -->
  <nav style="width:232px; min-width:232px; background:#201C20; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; border-right:1px solid #2A252A;">
    <div style="padding:16px 14px 13px; border-bottom:1px solid #2A252A; flex-shrink:0; display:flex; align-items:center; gap:10px;">
      <div style="width:30px; height:30px; background:#40233F; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 2C7 4 5 7 5 10s2 6 5 8c3-2 5-5 5-8s-2-6-5-8Z" fill="#B79BB3" opacity=".7"/><circle cx="10" cy="10" r="2.5" fill="#F0EEEB"/></svg>
      </div>
      <div>
        <div style="color:#F0EEEB; font-size:12px; font-weight:700; line-height:1.3; letter-spacing:.01em;">CareSync CCOS</div>
        <div style="color:#4E484C; font-size:10px; font-weight:500; line-height:1.4;">Design System · v1.0</div>
      </div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:8px 8px 0;">
      <sc-for list="{{ navItems }}" as="item">
        <div onClick="{{ item.onClick }}" style="display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:5px; cursor:pointer; margin-bottom:1px; background:{{ item.bg }};" style-hover="background:#332E32;">
          {{ item.iconEl }}
          <span style="flex:1; font-size:12px; font-weight:{{ item.fw }}; color:{{ item.lc }}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4;">{{ item.label }}</span>
          <sc-if value="{{ item.isActive }}" hint-placeholder-val="{{ false }}">
            <div style="width:5px; height:5px; border-radius:999px; background:#8C6688; flex-shrink:0;"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="padding:12px 14px; border-top:1px solid #2A252A; flex-shrink:0; margin-top:8px;">
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:30px; height:30px; border-radius:999px; background:#553052; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1.5px solid #684663;">
          <span style="color:#EEE7ED; font-size:10px; font-weight:700;">AR</span>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="color:#E2DEDA; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4;">Dr. Ananya Rao</div>
          <div style="color:#4E484C; font-size:10px; font-weight:400; line-height:1.3;">General Medicine · Morning Shift</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0;">
    <header style="height:56px; background:#FFFFFF; border-bottom:1px solid #E2DEDA; display:flex; align-items:center; padding:0 28px; gap:16px; flex-shrink:0;">
      <div style="flex:1; min-width:0; overflow:hidden;">
        <span style="font-size:13px; font-weight:700; color:#201C20; letter-spacing:-.01em;">{{ pageTitle }}</span>
        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:12px; color:#7B7477; margin-left:10px;">{{ pageSub }}</span>
        </sc-if>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
        <span style="font-size:11px; font-weight:600; color:#635C60; background:#F0EEEB; padding:3px 9px; border-radius:4px; border:1px solid #E2DEDA;">v1.0.0</span>
        <span style="font-size:11px; color:#AAA3A5; padding:3px 8px;">Jun 2026</span>
        <div style="width:28px; height:28px; border-radius:999px; background:#553052; display:flex; align-items:center; justify-content:center; cursor:pointer;">
          <span style="color:#EEE7ED; font-size:9px; font-weight:700;">AR</span>
        </div>
      </div>
    </header>

    <main style="flex:1; overflow-y:auto;">
      {{ sectionContent }}
    </main>
  </div>

</div>
</x-dc>

        ...[[18,'Appointments today','+2 vs yesterday',T.n900,T.n0,T.n200,false],['12m','Avg wait time','+4m · Near threshold',T.wa700,T.wa50,T.wa200,true],['7/12','Tasks completed','5 open · 1 overdue',T.n900,T.n0,T.n200,false],['4/6','Messages resolved','2 unread · 1 action req.',T.n900,T.n0,T.n200,false]].map(([v,l,n,vc,bg,b,warn])=>
          e('div',{key:l,style:{background:bg,border:`1px solid ${b}`,borderRadius:6,padding:'14px 18px'}},
            e('div',{style:{fontSize:11,fontWeight:600,color:T.n500,marginBottom:6,textTransform:'uppercase',letterSpacing:'.04em'}},l),
            e('div',{style:{fontSize:28,fontWeight:700,color:vc,fontVariantNumeric:'tabular-nums',lineHeight:1,marginBottom:4}},v),
            e('div',{style:{fontSize:12,color:warn?T.wa700:T.n500}},n)
          )
        )
      ),
      e('div',{style:{fontSize:11,fontWeight:700,color:T.n500,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:12}},'Operational insights'),
      e('div',{style:{display:'flex',flexDirection:'column',gap:10}},
        ...[{ic2:'alertTriangle',icc:T.wa600,bg:T.wa50,b:T.wa200,what:'Queue wait time rising',why:'Average wait is 12 minutes — 80% of the 15-minute threshold.',action:'Review appointment schedule and consider calling next patient early.',owner:'Dr. Ananya Rao',period:'Last 30 minutes',src:'Queue management system'},{ic2:'trendingUp',icc:T.in600,bg:T.in50,b:T.in200,what:'Elevated glucose for 2 patients today',why:'Meera Iyer (142 mg/dL) and Arvind Menon (138 mg/dL) showing above-range fasting glucose.',action:'Review results before consultations. Update medication plans if indicated.',owner:'Dr. Ananya Rao',period:'Today',src:'Lab results system'},{ic2:'checkCircle',icc:T.su600,bg:T.su50,b:T.su200,what:'Night shift handover complete',why:'All 3 handover tasks have been acknowledged by Morning Shift.',action:'No action required. Continue monitoring.',owner:'System',period:'This morning',src:'Handover system'}].map((ins,i)=>
          e('div',{key:i,style:{background:ins.bg,border:`1px solid ${ins.b}`,borderRadius:6,padding:'16px 20px'}},
            e('div',{style:{display:'flex',gap:12}},
              e('div',{style:{marginTop:2,flexShrink:0}},ic(ins.ic2,18,ins.icc)),
              e('div',{style:{flex:1}},
                e('div',{style:{fontSize:14,fontWeight:700,color:T.n900,marginBottom:5}},ins.what),
                e('div',{style:{fontSize:13,color:T.n700,marginBottom:10,lineHeight:'20px'}},ins.why),
                e('div',{style:{background:'rgba(255,255,255,.65)',border:'1px solid rgba(0,0,0,.06)',borderRadius:4,padding:'8px 12px',marginBottom:10}},
                  e('div',{style:{fontSize:11,fontWeight:700,color:T.n500,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:3}},'Recommended action'),
                  e('div',{style:{fontSize:13,color:T.n800}},ins.action)
                ),
                e('div',{style:{display:'flex',gap:12,flexWrap:'wrap'}},
                  ...[[`Owner: ${ins.owner}`,T.n500],[ins.period,T.n400],[`Source: ${ins.src}`,T.n400]].map(([t,c],j)=>[j>0?e('span',{key:'d'+j,style:{fontSize:11,color:T.n300}},'·'):null,e('span',{key:'t'+j,style:{fontSize:11,color:c}},t)]).flat().filter(Boolean)
                )
              )
            )
          )
        )
      )
    );
  };

  // ─── RENDER VALS ─────────────────────────────────────────────
  renderVals() {
    const {sec}=this.state; const T=this.T;
    const secs=[{id:'00',l:'00  Cover & Docs',ic:'bookmark'},{id:'01',l:'01  Foundations',ic:'layers'},{id:'02',l:'02  Core Components',ic:'layout'},{id:'03',l:'03  Enterprise',ic:'filter'},{id:'04',l:'04  Clinical',ic:'activity'},{id:'05',l:'05  Patterns',ic:'grid'},{id:'06',l:'06  Templates',ic:'monitor'},{id:'07',l:'07  Product Examples',ic:'eye'},{id:'99',l:'99  Deprecated',ic:'archive'}];
    const navItems=secs.map(s=>({id:s.id,label:s.l,isActive:s.id===sec,bg:s.id===sec?T.n800:'transparent',lc:s.id===sec?T.n100:T.n600,fw:s.id===sec?600:400,onClick:()=>this.setState({sec:s.id}),iconEl:this.ic(s.ic,15,s.id===sec?T.b300:T.n600)}));
    const titles={'00':['Cover & Documentation','CareSync Clinical Operations System'],'01':['Foundations','Colour · Typography · Spacing · Shape · Elevation · Motion'],'02':['Core Components','Buttons · Inputs · Status system · Navigation · Feedback'],'03':['Enterprise Components','Data tables · Filters · Timeline · Audit · Notifications'],'04':['Clinical Components','Patient identity · Safety · Metrics · Action rows · Lab results'],'05':['Patterns','Shift briefing · Patient profile · Queue · Communication · Tasks'],'06':['Page Templates','Application shell · Dashboard · Table · Profile · Communication'],'07':['Product Examples','Full-fidelity CareSync screen compositions'],'99':['Deprecated','Components scheduled for removal — do not use in new work']};
    const [pt,ps]=titles[sec]||['',''];
    const rr={'00':this.r00,'01':this.r01,'02':this.r02,'03':this.r03,'04':this.r04,'05':this.r05,'06':this.r06,'07':this.r07,'99':this.r99};
    const renderer=rr[sec];
    return {navItems,pageTitle:pt,pageSub:ps,hasSub:!!ps,sectionContent:renderer?renderer.call(this):null};
  }
}
</script>
