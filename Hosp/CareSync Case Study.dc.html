<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#CBC5C1;border-radius:999px;}
  </style>
</helmet>

<div style="display:flex; height:100vh; font-family:'Source Sans 3',-apple-system,sans-serif; overflow:hidden; background:#F7F6F4;">

  <!-- Sidebar nav -->
  <nav style="width:220px; min-width:220px; background:#FFFFFF; border-right:1px solid #E2DEDA; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0;">
    <div style="padding:18px 16px 14px; border-bottom:1px solid #E2DEDA; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:9px; margin-bottom:10px;">
        <div style="width:28px; height:28px; background:#40233F; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2C7 4 5 7 5 10s2 6 5 8c3-2 5-5 5-8S13 4 10 2Z" fill="#B79BB3" opacity=".8"/><circle cx="10" cy="10" r="2.5" fill="#F0EEEB"/></svg>
        </div>
        <div>
          <div style="font-size:12px; font-weight:700; color:#201C20; line-height:1.3;">CareSync</div>
          <div style="font-size:10px; color:#7B7477; line-height:1.3;">UX/UI Case Study</div>
        </div>
      </div>
    </div>
    <div style="flex:1; overflow-y:auto; padding:8px 8px;">
      <sc-for list="{{ navItems }}" as="item">
        <div onClick="{{ item.onClick }}" style="display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:5px; cursor:pointer; margin-bottom:1px; background:{{ item.bg }};" style-hover="background:#F7F6F4;">
          <span style="font-size:10px; font-weight:700; color:{{ item.nc }}; margin-top:2px; flex-shrink:0; min-width:18px; font-variant-numeric:tabular-nums;">{{ item.num }}</span>
          <span style="font-size:12px; font-weight:{{ item.fw }}; color:{{ item.lc }}; line-height:1.4;">{{ item.label }}</span>
        </div>
      </sc-for>
    </div>
    <div style="padding:12px 14px; border-top:1px solid #E2DEDA; flex-shrink:0;">
      <div style="font-size:11px; color:#7B7477;">Dr. Ananya Rao · General Medicine</div>
      <div style="font-size:10px; color:#AAA3A5; margin-top:2px;">UX/UI Assignment 2026</div>
    </div>
  </nav>

  <!-- Content -->
  <main style="flex:1; overflow-y:auto; overflow-x:hidden;">
    {{ sectionContent }}
  </main>

</div>
</x-dc>

  // ─── 03: REFRAMING ────────────────────────────────────────────
  r03 = () => {
    const T=this.T; const e=React.createElement;
    return e('div',{style:this.pg},
      e('div',{style:{maxWidth:760}},
